name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['docs_site/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    # Requires repo secret CLOUDFLARE_API_TOKEN (token with Pages:Edit permission)
    # and CLOUDFLARE_ACCOUNT_ID. Set both in Settings → Secrets → Actions.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs_site/package-lock.json

      - name: Install dependencies
        working-directory: docs_site
        run: npm ci

      - name: Build
        working-directory: docs_site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: pages deploy docs_site/dist --project-name=justapi-docs --branch=main
