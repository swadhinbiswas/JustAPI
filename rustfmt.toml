# JustAPI — rustfmt configuration
# Applied by `cargo fmt` and CI.
# See https://rust-lang.github.io/rustfmt/
#
# NOTE: only STABLE rustfmt options are used here so that `cargo fmt --check`
# passes on the stable toolchain (the AGENTS.md gate runs on stable). Nightly-
# only options (`imports_granularity`, `group_imports`, `format_code_in_doc_comments`,
# `wrap_comments`, `normalize_comments`) were removed — keeping them makes
# stable rustfmt emit "unstable features only available in nightly" warnings.

edition = "2021"

# ── Formatting style ─────────────────────────────────────────
max_width = 100
use_small_heuristics = "Max"
tab_spaces = 4
