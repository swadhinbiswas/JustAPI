[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    "RUSTSEC-2024-0436",  # paste: unmaintained, transitive via candle-core/gemm — no replacement available
    "RUSTSEC-2025-0001",  # rustls-pemfile: unmaintained, but actively used for TLS cert loading
    "RUSTSEC-2023-0071",  # rsa: Marvin Attack timing side-channel, transitive via sqlx-mysql — no fix yet
    # spin 0.9.8: yanked, transitive via flume → sqlx-sqlite — no impact on our usage
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "MIT-0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
