[package]
name = "justapi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "justapi-bench"
path = "src/main.rs"

[[bin]]
name = "justapi-bench-inference"
path = "src/inference_bench.rs"

[[bin]]
name = "justapi-gpu-bench"
path = "src/gpu_bench.rs"

[features]
default = []
real = ["justapi-inference/real", "justapi-inference/cuda"]
cuda = ["justapi-inference/cuda"]
simd-json = ["justapi-core/simd-json"]

[dependencies]
justapi-core.workspace = true
justapi-inference = { path = "../justapi-inference" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
