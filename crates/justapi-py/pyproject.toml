[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "justapi"
version = "2.0.9"
description = "JustAPI Runtime — a Rust-powered, FastAPI-class web framework for Python. Blazing-fast routing, native JSON validation, dependency injection, OpenAPI, WebSockets, SSE, background tasks, and an embedded DAG engine — all from a single pip install."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "JustAPI contributors" }]
keywords = [
    "web",
    "framework",
    "api",
    "fastapi",
    "rust",
    "pyo3",
    "async",
    "openapi",
    "websocket",
    "rest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
justapi = "justapi.cli:main"

[project.optional-dependencies]

orjson = ["orjson>=3.10"]
pydantic = ["pydantic>=2.0"]
jinja = ["jinja2>=3.0"]
full = ["orjson>=3.10", "pydantic>=2.0", "jinja2>=3.0"]
test = [
    "pydantic>=2.0",
    "jinja2>=3.0",
    "websockets>=12.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/swadhinbiswas/JustAPI"
Repository = "https://github.com/swadhinbiswas/JustAPI"
Documentation = "https://github.com/swadhinbiswas/JustAPI#readme"
"Bug Tracker" = "https://github.com/swadhinbiswas/JustAPI/issues"

[tool.maturin]
module-name = "justapi._justapi"
python-source = "python"
manifest-path = "Cargo.toml"
strip = true
# abi3 is enabled by the `abi3` Cargo feature (on by default for GIL-locked
# CPython wheels). Free-threaded builds (3.13t/3.14t) must disable it — the
# limited API cannot be free-threaded — via `--no-default-features`.
include = ["README.md", "LICENSE"]
