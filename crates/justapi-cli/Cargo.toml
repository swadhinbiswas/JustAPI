[package]
name = "justapi-cli"
description = "JustAPI CLI — serve, create, check, profile, openapi, hot reload. High-performance Rust CLI for the JustAPI framework."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "justapi-cli"
path = "src/main.rs"

[features]
default = []
tls = ["justapi-core/tls"]
compression = ["justapi-core/compression"]
opentelemetry = ["justapi-core/opentelemetry"]
inference = ["justapi-core/inference", "dep:justapi-inference"]

[dependencies]
justapi-core = { workspace = true, features = ["db"] }
justapi-inference = { version = "2.0.9", path = "../justapi-inference", optional = true }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
libc.workspace = true
notify-debouncer-mini = "0.7"
notify = "8"

[dev-dependencies]
hyper = { version = "1", features = ["http1"] }
