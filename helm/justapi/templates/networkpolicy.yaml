{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "justapi.fullname" . }}
  labels:
    {{- include "justapi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "justapi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller + same-namespace traffic (e.g. migration Job).
    - from:
        {{- toYaml .Values.networkPolicy.allowIngressFrom | nindent 8 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    # DNS is required for service discovery (postgres/redis/OTLP endpoints).
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    - to:
        {{- toYaml .Values.networkPolicy.allowEgressTo | nindent 8 }}
{{- end }}
