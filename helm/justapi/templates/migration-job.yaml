{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "justapi.fullname" . }}-migrate
  labels:
    {{- include "justapi.labels" . | nindent 4 }}
  annotations:
    # Run migrations before the app (re)starts, clean up after success.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "justapi.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["justapi", "db", "migrate"]
          args:
            - --url
            - $(DATABASE_URL)
            - --dir
            - /migrations
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: justapi-db
                  key: url
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ required "migrations.configMapName is required when migrations.enabled is true" .Values.migrations.configMapName }}
{{- end }}
