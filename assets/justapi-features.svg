<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#111631"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6522c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e6522c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#bg4)"/>
  <circle cx="600" cy="270" r="260" fill="url(#core)">
    <animate attributeName="r" values="240;270;240" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- center -->
  <text x="600" y="255" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#e6522c" letter-spacing="2">JUSTAPI</text>
  <text x="600" y="285" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">Rust core · Python surface</text>

  <!-- feature nodes: (cx, cy, icon, title, sub) -->
  <!-- 12 nodes in 3 rings of 4 -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- ring A: performance -->
    <g>
      <circle cx="600" cy="70" r="34" fill="#1e293b" stroke="#f5a524" stroke-width="2"/>
      <text x="600" y="66" text-anchor="middle" font-size="20">⚡</text>
      <text x="600" y="86" text-anchor="middle" font-size="11" fill="#f5a524" font-weight="700">766k req/s</text>
      <circle r="3" fill="#f5a524">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="600" y="125" text-anchor="middle" font-size="12" fill="#94a3b8">hello-world native</text>
    </g>

    <g>
      <circle cx="1130" cy="270" r="34" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="1130" y="266" text-anchor="middle" font-size="20">🗄️</text>
      <text x="1130" y="286" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="700">native DB awaits</text>
      <circle r="3" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="1130" y="325" text-anchor="middle" font-size="12" fill="#94a3b8">query_async · 53x</text>
    </g>

    <g>
      <circle cx="600" cy="470" r="34" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="600" y="466" text-anchor="middle" font-size="20">🧠</text>
      <text x="600" y="486" text-anchor="middle" font-size="11" fill="#8b5cf6" font-weight="700">free-threaded</text>
      <circle r="3" fill="#8b5cf6">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="600" y="525" text-anchor="middle" font-size="12" fill="#94a3b8">CPython 3.14t · 12.4x CPU</text>
    </g>

    <g>
      <circle cx="70" cy="270" r="34" fill="#1e293b" stroke="#e6522c" stroke-width="2"/>
      <text x="70" y="266" text-anchor="middle" font-size="20">🔐</text>
      <text x="70" y="286" text-anchor="middle" font-size="11" fill="#e6522c" font-weight="700">HTTP/3</text>
      <circle r="3" fill="#e6522c">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="325" text-anchor="middle" font-size="12" fill="#94a3b8">QUIC, no one else ships it</text>
    </g>

    <!-- ring B: middle ring -->
    <g>
      <circle cx="850" cy="130" r="34" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="850" y="126" text-anchor="middle" font-size="20">📡</text>
      <text x="850" y="146" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="700">native SSE</text>
      <circle r="3" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="850" y="185" text-anchor="middle" font-size="12" fill="#94a3b8">sse_native · 0 Python/event</text>
    </g>

    <g>
      <circle cx="350" cy="130" r="34" fill="#1e293b" stroke="#f5a524" stroke-width="2"/>
      <text x="350" y="126" text-anchor="middle" font-size="20">🧩</text>
      <text x="350" y="146" text-anchor="middle" font-size="11" fill="#f5a524" font-weight="700">native CRUD</text>
      <circle r="3" fill="#f5a524">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="350" y="185" text-anchor="middle" font-size="12" fill="#94a3b8">181k SELECT · 125x FastAPI</text>
    </g>

    <g>
      <circle cx="350" cy="410" r="34" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="350" y="406" text-anchor="middle" font-size="20">🚀</text>
      <text x="350" y="426" text-anchor="middle" font-size="11" fill="#8b5cf6" font-weight="700">multi-worker</text>
      <circle r="3" fill="#8b5cf6">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text x="350" y="465" text-anchor="middle" font-size="12" fill="#94a3b8">--workers N · 1.88x @4</text>
    </g>

    <g>
      <circle cx="850" cy="410" r="34" fill="#1e293b" stroke="#e6522c" stroke-width="2"/>
      <text x="850" y="406" text-anchor="middle" font-size="20">📋</text>
      <text x="850" y="426" text-anchor="middle" font-size="11" fill="#e6522c" font-weight="700">OpenAPI 3.1</text>
      <circle r="3" fill="#e6522c">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="850" y="465" text-anchor="middle" font-size="12" fill="#94a3b8">Pydantic v2 bridge</text>
    </g>

    <!-- inner ring: security + observability -->
    <g>
      <circle cx="600" cy="190" r="26" fill="#111631" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="600" y="188" text-anchor="middle" font-size="15">🛡️</text>
      <text x="600" y="206" text-anchor="middle" font-size="9" fill="#22d3ee" font-weight="700">JWT · rate-limit · CORS</text>
    </g>
    <g>
      <circle cx="740" cy="270" r="26" fill="#111631" stroke="#f5a524" stroke-width="1.5"/>
      <text x="740" y="268" text-anchor="middle" font-size="15">📊</text>
      <text x="740" y="286" text-anchor="middle" font-size="9" fill="#f5a524" font-weight="700">OTel · Prometheus</text>
    </g>
    <g>
      <circle cx="600" cy="350" r="26" fill="#111631" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="600" y="348" text-anchor="middle" font-size="15">🔁</text>
      <text x="600" y="366" text-anchor="middle" font-size="9" fill="#8b5cf6" font-weight="700">circuit breakers</text>
    </g>
    <g>
      <circle cx="460" cy="270" r="26" fill="#111631" stroke="#e6522c" stroke-width="1.5"/>
      <text x="460" y="268" text-anchor="middle" font-size="15">🧪</text>
      <text x="460" y="286" text-anchor="middle" font-size="9" fill="#e6522c" font-weight="700">mypy-clean stubs</text>
    </g>

    <!-- connecting lines -->
    <g stroke="#334155" stroke-width="1" opacity="0.6">
      <line x1="600" y1="104" x2="850" y2="130"/>
      <line x1="600" y1="104" x2="350" y2="130"/>
      <line x1="1130" y1="236" x2="850" y2="164"/>
      <line x1="70" y1="236" x2="350" y2="164"/>
      <line x1="600" y1="436" x2="850" y2="410"/>
      <line x1="600" y1="436" x2="350" y2="410"/>
      <line x1="1130" y1="304" x2="740" y2="296"/>
      <line x1="70" y1="304" x2="460" y2="296"/>
    </g>
  </g>
</svg>
